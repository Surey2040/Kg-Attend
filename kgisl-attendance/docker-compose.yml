version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kgisl
      POSTGRES_PASSWORD: kgisl
      POSTGRES_DB: kgisl_attendance
    ports:
      - '5432:5432'
    volumes:
      - kgisl_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kgisl -d kgisl_attendance"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '5000-5003:5000'
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      AI_ENGINE_URL: http://ai-engine:8000
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ai-engine:
        condition: service_started

  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '8000:8000'

volumes:
  kgisl_pg_data:

